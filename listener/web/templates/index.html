<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listener</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:40px 16px 80px;
}

.container{width:100%;max-width:580px}

/* ---- Header ---- */
header{text-align:center;margin-bottom:28px}
header h1{font-size:24px;font-weight:700;letter-spacing:-.5px;color:#1e293b}
header p{color:#64748b;font-size:13px;margin-top:3px}

/* ---- Cards ---- */
.card{
  background:#fff;
  border-radius:14px;
  padding:20px 24px;
  margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
}

.card-label{
  font-size:11px;font-weight:700;color:#94a3b8;
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;
}

/* ---- Settings ---- */
.settings-row{display:flex;gap:12px;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.fg label{font-size:11px;font-weight:600;color:#64748b}
select{
  padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;
  font-size:13px;background:#fff;color:#0f172a;outline:none;
  transition:border .2s;cursor:pointer;
}
select:focus{border-color:#6366f1}
select:disabled{opacity:.45;cursor:not-allowed}

.cb-row{
  display:flex;align-items:center;gap:7px;
  width:100%;margin-top:4px;
}
.cb-row label{font-size:13px;color:#475569;cursor:pointer;user-select:none}

/* ---- Recorder ---- */
.rec-card{display:flex;flex-direction:column;align-items:center;padding:32px 24px 24px}

.rec-btn{
  width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;
  color:#fff;font-size:14px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:background .25s,transform .15s,box-shadow .3s;outline:none;
}
.rec-btn:active{transform:scale(.95)}

.rec-btn.idle{background:#6366f1}
.rec-btn.idle:hover{background:#4f46e5;transform:scale(1.04)}
.rec-btn.recording{background:#ef4444;animation:pulse 2s ease-in-out infinite}
.rec-btn.recording:hover{background:#dc2626}
.rec-btn.processing{background:#94a3b8;cursor:default}
.rec-btn.done{background:#22c55e}
.rec-btn.done:hover{background:#16a34a;transform:scale(1.04)}
.rec-btn.error{background:#f97316}
.rec-btn.error:hover{background:#ea580c;transform:scale(1.04)}

@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.35)}
  50%{box-shadow:0 0 0 18px rgba(239,68,68,0)}
}

.bi{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.ic{width:16px;height:16px;background:#fff;border-radius:50%}
.is{width:14px;height:14px;background:#fff;border-radius:3px}
.ip{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.timer{font-size:38px;font-weight:300;font-variant-numeric:tabular-nums;margin-top:18px;color:#111}
.stxt{font-size:13px;color:#64748b;margin-top:5px;min-height:18px}
.stxt.err{color:#ef4444}

/* ---- Viewer ---- */
.viewer{display:none;animation:fadeUp .3s ease}
.viewer.open{display:block}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.v-head{margin-bottom:16px}
.v-title{font-size:18px;font-weight:700;color:#1e293b;line-height:1.3}
.v-meta{font-size:12px;color:#64748b;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.v-meta span{display:flex;align-items:center;gap:3px}

.tabs{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:0;gap:2px}
.tab{
  padding:9px 18px;border:none;background:none;
  font-size:13px;font-weight:600;color:#94a3b8;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;
}
.tab:hover{color:#475569}
.tab.on{color:#6366f1;border-bottom-color:#6366f1}
.tab:disabled{opacity:.35;cursor:default}

.content{
  max-height:420px;overflow-y:auto;
  padding:20px;background:#f8fafc;
  border-radius:0 0 10px 10px;
  line-height:1.75;font-size:14px;color:#334155;
}

/* Markdown rendering */
.content h1{font-size:17px;font-weight:700;color:#1e293b;margin:20px 0 8px}
.content h2{font-size:15px;font-weight:700;color:#334155;margin:18px 0 6px}
.content h3{font-size:14px;font-weight:600;color:#475569;margin:14px 0 4px}
.content p{margin:6px 0}
.content hr{border:none;border-top:1px solid #e2e8f0;margin:16px 0}
.content ul,.content ol{padding-left:22px;margin:6px 0}
.content li{margin:3px 0}
.content strong{color:#1e293b}
.content em{font-style:italic;color:#475569}
.content .ts{
  font-family:'SF Mono',SFMono-Regular,Menlo,monospace;
  font-size:12px;color:#6366f1;background:#eef2ff;
  padding:1px 5px;border-radius:4px;
}
.content .task{display:flex;align-items:flex-start;gap:6px;margin:4px 0}
.content .task input{margin-top:4px}
.content .task.done{color:#64748b;text-decoration:line-through}

.content audio{width:100%;margin:12px 0}

/* ---- Speaker colors ---- */
.spk{font-weight:700;padding:1px 6px;border-radius:4px;font-size:12px;margin-right:2px}
.spk-1{color:#6366f1;background:#eef2ff}
.spk-2{color:#059669;background:#ecfdf5}
.spk-3{color:#d97706;background:#fffbeb}
.spk-4{color:#dc2626;background:#fef2f2}
.spk-5{color:#7c3aed;background:#f5f3ff}
.spk-6{color:#0891b2;background:#ecfeff}
.spk-7{color:#be185d;background:#fdf2f8}
.spk-8{color:#4338ca;background:#eef2ff}
.spk-unknown{color:#64748b;background:#f1f5f9}

.speaker-legend{
  display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;
  padding:10px 14px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0;
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#475569}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-dot.c1{background:#6366f1}
.legend-dot.c2{background:#059669}
.legend-dot.c3{background:#d97706}
.legend-dot.c4{background:#dc2626}
.legend-dot.c5{background:#7c3aed}
.legend-dot.c6{background:#0891b2}
.legend-dot.c7{background:#be185d}
.legend-dot.c8{background:#4338ca}
.legend-dot.cu{background:#64748b}

.talk-time{font-size:11px;color:#94a3b8;margin-left:2px}

.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

.dl-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.dl-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:8px 14px;border:1px solid #e2e8f0;border-radius:8px;
  background:#f8fafc;text-decoration:none;color:#475569;
  font-size:12px;font-weight:600;transition:all .15s;
}
.dl-btn:hover{background:#f1f5f9;border-color:#cbd5e1;color:#334155}
.dl-btn svg{width:14px;height:14px}

/* ---- Sessions list ---- */
.slist{list-style:none}
.sitem{
  padding:12px 14px;margin-bottom:6px;
  border-radius:10px;cursor:pointer;
  transition:background .15s;
  display:flex;justify-content:space-between;align-items:center;
}
.sitem:hover{background:#f1f5f9}
.sitem.active{background:#eef2ff}
.s-left{}
.s-title{font-size:14px;font-weight:600;color:#1e293b}
.s-date{font-size:12px;color:#94a3b8;margin-top:2px}
.s-badges{display:flex;gap:4px}
.badge{
  font-size:10px;font-weight:600;padding:2px 7px;
  border-radius:5px;text-transform:uppercase;letter-spacing:.3px;
}
.badge.tr{background:#dbeafe;color:#3b82f6}
.badge.an{background:#dcfce7;color:#16a34a}
.badge.au{background:#fef3c7;color:#d97706}

.empty{text-align:center;color:#94a3b8;font-size:13px;padding:16px 0}

/* ---- Analytics Dashboard (F8) ---- */
.analytics-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;
}
.analytics-card{
  background:#fff;border-radius:10px;padding:14px;
  border:1px solid #e2e8f0;
}
.analytics-card.full{grid-column:1/-1}
.analytics-card h4{
  font-size:12px;font-weight:700;color:#94a3b8;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;
}
.analytics-card canvas{width:100%!important;max-height:220px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f1f5f9}
.stat-row:last-child{border-bottom:none}
.stat-label{font-size:13px;color:#475569;display:flex;align-items:center;gap:6px}
.stat-val{font-size:13px;font-weight:600;color:#1e293b}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.analytics-summary{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;
}
.analytics-summary .stat-box{
  flex:1;min-width:100px;background:#f8fafc;border-radius:8px;
  padding:10px 12px;text-align:center;border:1px solid #e2e8f0;
}
.stat-box .stat-num{font-size:20px;font-weight:700;color:#1e293b}
.stat-box .stat-desc{font-size:11px;color:#94a3b8;margin-top:2px}
.topics-list{list-style:none;padding:0}
.topics-list li{
  font-size:13px;color:#475569;padding:4px 0;
  border-bottom:1px solid #f1f5f9;
}
.topics-list li:last-child{border-bottom:none}
.no-analytics{text-align:center;color:#94a3b8;font-size:13px;padding:40px 20px}

@media(max-width:500px){
  .analytics-grid{grid-template-columns:1fr}
}

/* ---- Webhooks (F10) ---- */
.webhook-list{list-style:none;padding:0;margin:0}
.webhook-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;margin-bottom:6px;background:#f8fafc;
  border-radius:8px;border:1px solid #e2e8f0;gap:8px;
}
.webhook-item .wh-info{flex:1;min-width:0}
.webhook-item .wh-url{font-size:13px;color:#1e293b;font-weight:500;word-break:break-all}
.webhook-item .wh-meta{font-size:11px;color:#94a3b8;margin-top:2px}
.webhook-item .wh-actions{display:flex;gap:4px;flex-shrink:0}
.wh-btn{
  padding:5px 10px;border:1px solid #e2e8f0;border-radius:6px;
  background:#fff;font-size:11px;font-weight:600;cursor:pointer;
  transition:all .15s;color:#475569;
}
.wh-btn:hover{background:#f1f5f9;border-color:#cbd5e1}
.wh-btn.del{color:#ef4444;border-color:#fecaca}
.wh-btn.del:hover{background:#fef2f2;border-color:#ef4444}
.wh-btn.test{color:#6366f1;border-color:#c7d2fe}
.wh-btn.test:hover{background:#eef2ff;border-color:#6366f1}
.wh-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.wh-form input[type="url"]{
  flex:1;min-width:200px;padding:7px 10px;border:1px solid #e2e8f0;
  border-radius:8px;font-size:13px;outline:none;
}
.wh-form input[type="url"]:focus{border-color:#6366f1}
.wh-form select{
  padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;
  font-size:13px;background:#fff;
}
.wh-add-btn{
  padding:7px 16px;background:#6366f1;color:#fff;border:none;
  border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  transition:background .15s;
}
.wh-add-btn:hover{background:#4f46e5}
.wh-status{font-size:12px;margin-top:6px;min-height:18px}
.wh-status.ok{color:#16a34a}
.wh-status.fail{color:#ef4444}
.wh-empty{text-align:center;color:#94a3b8;font-size:13px;padding:12px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="container">
  <header>
    <h1>Listener</h1>
    <p>Meeting Recorder &amp; Analyzer</p>
  </header>

  <!-- Settings -->
  <div class="card" id="settings-card">
    <div class="card-label">Settings</div>
    <div class="settings-row">
      <div class="fg">
        <label for="device">Input Device</label>
        <select id="device"><option>Loading...</option></select>
      </div>
      <div class="fg">
        <label for="language">Language</label>
        <select id="language">
          <option value="">Auto (Mixed Language)</option>
          <option value="en">Force English</option>
          <option value="tr">Force Turkish</option>
        </select>
      </div>
      <div class="cb-row">
        <input type="checkbox" id="skip-analysis">
        <label for="skip-analysis">Skip Claude analysis (transcript only)</label>
      </div>
    </div>
  </div>

  <!-- Recorder -->
  <div class="card rec-card" id="rec-card">
    <button id="rec-btn" class="rec-btn idle" onclick="toggle()">
      <span class="bi"><div class="ic"></div></span>
      <span id="rlbl">Record</span>
    </button>
    <div id="timer" class="timer">00:00</div>
    <div id="stxt" class="stxt">Ready</div>
  </div>

  <!-- Viewer -->
  <div class="card viewer" id="viewer">
    <div class="v-head">
      <div class="v-title" id="v-title"></div>
      <div class="v-meta" id="v-meta"></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="content" id="content"></div>
    <div class="dl-row" id="dl-row"></div>
  </div>

  <!-- Sessions -->
  <div class="card">
    <div class="card-label">Past Sessions</div>
    <ul class="slist" id="slist">
      <li class="empty">No sessions yet</li>
    </ul>
  </div>

  <!-- Webhooks (F10) -->
  <div class="card" id="webhooks-card">
    <div class="card-label">Webhooks</div>
    <ul class="webhook-list" id="wh-list">
      <li class="wh-empty">Loading...</li>
    </ul>
    <div class="wh-form">
      <input type="url" id="wh-url" placeholder="https://hooks.slack.com/..." />
      <select id="wh-format">
        <option value="json">JSON</option>
        <option value="slack">Slack</option>
        <option value="markdown">Markdown</option>
      </select>
      <button class="wh-add-btn" onclick="addWebhook()">Add</button>
    </div>
    <div class="wh-status" id="wh-status"></div>
  </div>
</div>

<script>
// ===========================================================================
// State
// ===========================================================================
let ui = 'idle';
let tRef = null, recStart = null;
let viewerSession = null;  // currently viewed session data

const DL_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M10 3a1 1 0 011 1v7.586l2.293-2.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 111.414-1.414L9 11.586V4a1 1 0 011-1z"/><path d="M3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/></svg>';

// ===========================================================================
// Init
// ===========================================================================
(async()=>{
  await loadDevices();
  await loadSessions();
  loadWebhooks();
  setInterval(poll, 1200);
})();

// ===========================================================================
// Devices
// ===========================================================================
async function loadDevices(){
  try{
    const r=await f('/api/devices');
    const devs=await r.json();
    const s=Q('#device');
    s.innerHTML=devs.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');
  }catch(e){console.error(e)}
}

// ===========================================================================
// Record
// ===========================================================================
async function toggle(){
  if(ui==='idle'||ui==='done'||ui==='error') await doStart();
  else if(ui==='recording') await doStop();
}

async function doStart(){
  const body={
    device:val('device')!==''?parseInt(val('device')):null,
    language:val('language')||null,
    skip_analysis:Q('#skip-analysis').checked,
  };
  const r=await f('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const d=await r.json();alert(d.error);return}
  setUI('recording');
  closeViewer();
  recStart=Date.now();
  tRef=setInterval(tick,100);
}

async function doStop(){
  await f('/api/stop',{method:'POST'});
  clearInterval(tRef);tRef=null;
  setUI('processing');
}

// ===========================================================================
// UI state
// ===========================================================================
function setUI(state){
  ui=state;
  const btn=Q('#rec-btn'),ic=btn.querySelector('.bi'),lbl=Q('#rlbl'),st=Q('#stxt');
  btn.className='rec-btn '+state;
  const lock=state==='recording'||state==='processing';
  Q('#device').disabled=lock;
  Q('#language').disabled=lock;
  Q('#skip-analysis').disabled=lock;
  switch(state){
    case 'idle':
      ic.innerHTML='<div class="ic"></div>';lbl.textContent='Record';
      st.textContent='Ready';st.className='stxt';break;
    case 'recording':
      ic.innerHTML='<div class="is"></div>';lbl.textContent='Stop';
      st.textContent='Recording...';st.className='stxt';break;
    case 'processing':
      ic.innerHTML='<div class="ip"></div>';lbl.textContent='Wait';
      st.textContent='Transcribing...';st.className='stxt';break;
    case 'done':
      ic.innerHTML='<div class="ic"></div>';lbl.textContent='New';
      st.textContent='Complete';st.className='stxt';break;
    case 'error':
      ic.innerHTML='<div class="ic"></div>';lbl.textContent='Retry';
      st.className='stxt err';break;
  }
}

// ===========================================================================
// Timer
// ===========================================================================
function tick(){
  if(!recStart)return;
  Q('#timer').textContent=fmtT((Date.now()-recStart)/1000);
}
function fmtT(s){
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60);
  return h?`${pad(h)}:${pad(m)}:${pad(sec)}`:`${pad(m)}:${pad(sec)}`;
}
function pad(n){return n.toString().padStart(2,'0')}

function fmtDur(s){
  if(!s)return '';
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60);
  let p=[];if(h)p.push(h+'h');if(m)p.push(m+'m');p.push(sec+'s');return p.join(' ');
}

// ===========================================================================
// Poll
// ===========================================================================
async function poll(){
  try{
    const r=await f('/api/status');const d=await r.json();
    if(d.status!==ui){
      if(d.status==='done'){
        setUI('done');
        // Build session object from state and open viewer
        const sess={id:d.session_id,title:d.title||'',files:d.files,duration:0,language:''};
        openViewer(sess);
        loadSessions();
      }else if(d.status==='error'){
        setUI('error');
        Q('#stxt').textContent=d.error||'Something went wrong';
      }else if(d.status==='processing'&&ui!=='processing'){
        setUI('processing');
      }
    }
    if(d.status==='processing'&&d.step){
      const map={transcribing:'Transcribing audio...',diarizing:'Identifying speakers...',titling:'Generating title...',analyzing:'Analyzing with Claude...'};
      Q('#stxt').textContent=map[d.step]||'Processing...';
    }
  }catch(e){}
}

// ===========================================================================
// Viewer
// ===========================================================================
function openViewer(sess){
  viewerSession=sess;
  const v=Q('#viewer');
  Q('#v-title').textContent=sess.title||sess.id;

  // Meta line
  const parts=sess.id.split('_');
  const dateStr=parts[0]+' '+(parts[1]||'').replace(/-/g,':');
  let meta=`<span>${dateStr}</span>`;
  if(sess.duration) meta+=`<span>${fmtDur(sess.duration)}</span>`;
  if(sess.language) meta+=`<span>${sess.language.toUpperCase()}</span>`;
  Q('#v-meta').innerHTML=meta;

  // Tabs
  const files=sess.files||{};
  let tabs='';
  if(files.transcript) tabs+=`<button class="tab on" onclick="switchTab(this,'transcript')">Transcript</button>`;
  if(files.analysis) tabs+=`<button class="tab" onclick="switchTab(this,'analysis')">Analysis</button>`;
  if(files.audio) tabs+=`<button class="tab" onclick="switchTab(this,'audio')">Audio</button>`;
  tabs+=`<button class="tab" onclick="switchTab(this,'analytics')">Analytics</button>`;
  Q('#tabs').innerHTML=tabs;

  // Downloads
  let dl='';
  if(files.transcript) dl+=`<a class="dl-btn" href="/api/download/${files.transcript}" download>${DL_ICON} Transcript</a>`;
  if(files.analysis) dl+=`<a class="dl-btn" href="/api/download/${files.analysis}" download>${DL_ICON} Analysis</a>`;
  if(files.audio) dl+=`<a class="dl-btn" href="/api/download/${files.audio}" download>${DL_ICON} Audio</a>`;
  Q('#dl-row').innerHTML=dl;

  v.classList.add('open');

  // Load first tab
  if(files.transcript) loadTab('transcript');
  else if(files.analysis) loadTab('analysis');
  else if(files.audio) loadTab('audio');

  // Highlight in list
  document.querySelectorAll('.sitem').forEach(el=>{
    el.classList.toggle('active',el.dataset.id===sess.id);
  });
}

function closeViewer(){
  Q('#viewer').classList.remove('open');
  viewerSession=null;
  document.querySelectorAll('.sitem').forEach(el=>el.classList.remove('active'));
}

function switchTab(btn,tab){
  Q('#tabs').querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  loadTab(tab);
}

async function loadTab(tab){
  const c=Q('#content');
  const files=viewerSession?.files||{};

  if(tab==='analytics'){
    await loadAnalytics(viewerSession);
    return;
  }

  if(tab==='audio'){
    c.innerHTML=`<audio controls src="/api/download/${files.audio}" style="width:100%"></audio>
      <p style="text-align:center;color:#94a3b8;font-size:12px;margin-top:8px">Use the player above to listen to the recording</p>`;
    return;
  }

  const fname=tab==='transcript'?files.transcript:files.analysis;
  if(!fname){c.innerHTML='<p class="empty">Not available</p>';return}

  c.innerHTML='<p style="color:#94a3b8">Loading...</p>';
  try{
    const r=await f(`/api/view/${fname}`);
    const md=await r.text();
    let legendHtml = '';
    if (tab === 'transcript' && viewerSession?.id) {
      legendHtml = await loadSpeakerLegend(viewerSession.id);
    }
    c.innerHTML = legendHtml + renderMd(md);
  }catch(e){
    c.innerHTML='<p class="empty">Failed to load</p>';
  }
}

// ===========================================================================
// Markdown renderer
// ===========================================================================
function renderMd(md){
  const lines=md.split('\n');
  let html='',inUl=false;
  for(const raw of lines){
    const ln=raw.trimEnd();
    const t=ln.trim();
    if(!t){
      if(inUl){html+='</ul>';inUl=false}
      continue;
    }
    if(t==='---'){
      if(inUl){html+='</ul>';inUl=false}
      html+='<hr>';continue;
    }
    // Headers
    const hm=t.match(/^(#{1,4})\s+(.*)/);
    if(hm){
      if(inUl){html+='</ul>';inUl=false}
      const lvl=hm[1].length;
      html+=`<h${lvl}>${il(hm[2])}</h${lvl}>`;continue;
    }
    // Task list
    if(t.startsWith('- [ ] ')){
      if(!inUl){html+='<ul>';inUl=true}
      html+=`<li class="task"><input type="checkbox" disabled> ${il(t.slice(6))}</li>`;continue;
    }
    if(t.startsWith('- [x] ')||t.startsWith('- [X] ')){
      if(!inUl){html+='<ul>';inUl=true}
      html+=`<li class="task done"><input type="checkbox" checked disabled> ${il(t.slice(6))}</li>`;continue;
    }
    // List
    if(t.startsWith('- ')){
      if(!inUl){html+='<ul>';inUl=true}
      html+=`<li>${il(t.slice(2))}</li>`;continue;
    }
    // Numbered list
    const nm=t.match(/^\d+\.\s+(.*)/);
    if(nm){
      if(!inUl){html+='<ul>';inUl=true}
      html+=`<li>${il(nm[1])}</li>`;continue;
    }
    // Paragraph
    if(inUl){html+='</ul>';inUl=false}
    html+=`<p>${il(t)}</p>`;
  }
  if(inUl)html+='</ul>';
  return html;
}

function il(s){
  return s
    .replace(/\*\*(.*?)\*\*/g, function(m, inner) {
      // Check if this is a speaker label like "[00:15] Speaker 1:"
      var spkMatch = inner.match(/^\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s+(Speaker\s+(\d+)|Unknown):/);
      if (spkMatch) {
        var ts = spkMatch[1];
        var speaker = spkMatch[2];
        var num = spkMatch[3];
        var cls = num ? 'spk-' + Math.min(parseInt(num), 8) : 'spk-unknown';
        return '<span class="ts">[' + ts + ']</span> <span class="spk ' + cls + '">' + speaker + ':</span>';
      }
      return '<strong>' + inner + '</strong>';
    })
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/`(.*?)`/g,'<code>$1</code>')
    .replace(/\[(\d{1,2}:\d{2}(?::\d{2})?)\]/g,'<span class="ts">[$1]</span>');
}

// ===========================================================================
// Speaker Legend
// ===========================================================================
async function loadSpeakerLegend(sessionId) {
  try {
    const r = await f(`/api/speakers/${sessionId}`);
    const data = await r.json();
    const speakers = data.speakers || {};
    const keys = Object.keys(speakers);
    if (keys.length === 0) return '';

    let items = '';
    keys.forEach((label, i) => {
      const num = label.match(/Speaker\s+(\d+)/);
      const cls = num ? 'c' + Math.min(parseInt(num[1]), 8) : 'cu';
      const secs = speakers[label].talk_time_seconds || 0;
      const timeStr = fmtDur(secs);
      items += `<div class="legend-item"><span class="legend-dot ${cls}"></span>${esc(label)}<span class="talk-time">${timeStr}</span></div>`;
    });
    return `<div class="speaker-legend">${items}</div>`;
  } catch (e) {
    return '';
  }
}

// ===========================================================================
// Analytics Dashboard (F8)
// ===========================================================================
const CHART_COLORS = ['#6366f1','#059669','#d97706','#dc2626','#7c3aed','#0891b2','#be185d','#4338ca'];
let _pieChart = null, _barChart = null;

async function loadAnalytics(sess) {
  const c = Q('#content');
  if (!sess?.id) { c.innerHTML = '<p class="no-analytics">No session selected</p>'; return; }

  c.innerHTML = '<p style="color:#94a3b8">Loading analytics...</p>';

  try {
    const r = await f(`/api/analytics/${sess.id}`);
    if (!r.ok) {
      c.innerHTML = '<p class="no-analytics">No analytics available.<br><span style="font-size:12px">Analytics require speaker diarization (F1). Re-process with a HuggingFace token to enable.</span></p>';
      return;
    }
    const data = await r.json();
    renderAnalytics(c, data);
  } catch (e) {
    c.innerHTML = '<p class="no-analytics">Failed to load analytics</p>';
  }
}

function renderAnalytics(container, data) {
  // Destroy old charts
  if (_pieChart) { _pieChart.destroy(); _pieChart = null; }
  if (_barChart) { _barChart.destroy(); _barChart = null; }

  const speakers = data.speakers || {};
  const speakerNames = Object.keys(speakers);
  const hasSpeakers = speakerNames.length > 0;

  // Summary stats
  const durMin = Math.round((data.total_duration || 0) / 60);
  const silPct = Math.round((data.silence_ratio || 0) * 100);
  const segCount = data.segment_count || 0;

  let html = `<div class="analytics-summary">
    <div class="stat-box"><div class="stat-num">${durMin}</div><div class="stat-desc">Minutes</div></div>
    <div class="stat-box"><div class="stat-num">${speakerNames.length}</div><div class="stat-desc">Speakers</div></div>
    <div class="stat-box"><div class="stat-num">${segCount}</div><div class="stat-desc">Segments</div></div>
    <div class="stat-box"><div class="stat-num">${silPct}%</div><div class="stat-desc">Silence</div></div>
  </div>`;

  if (!hasSpeakers) {
    html += '<p class="no-analytics">No speaker data available for charts.</p>';
    container.innerHTML = html;
    return;
  }

  html += '<div class="analytics-grid">';

  // Pie chart: Talk Time Distribution
  html += `<div class="analytics-card">
    <h4>Talk Time</h4>
    <canvas id="pie-chart"></canvas>
  </div>`;

  // Bar chart: Turns Per Speaker
  html += `<div class="analytics-card">
    <h4>Speaking Turns</h4>
    <canvas id="bar-chart"></canvas>
  </div>`;

  // Speaker details table
  html += `<div class="analytics-card full">
    <h4>Speaker Details</h4>`;
  speakerNames.forEach((name, i) => {
    const s = speakers[name];
    const color = CHART_COLORS[i % CHART_COLORS.length];
    const timeStr = fmtDur(s.talk_time);
    html += `<div class="stat-row">
      <span class="stat-label"><span class="stat-dot" style="background:${color}"></span>${esc(name)}</span>
      <span class="stat-val">${timeStr} &middot; ${s.turns} turns &middot; ${s.percentage}%</span>
    </div>`;
  });
  html += '</div>';

  // Topics (if available)
  const topics = data.topics || [];
  if (topics.length > 0) {
    html += `<div class="analytics-card full"><h4>Topics Discussed</h4><ul class="topics-list">`;
    topics.forEach(t => {
      html += `<li>${esc(t.name)}</li>`;
    });
    html += '</ul></div>';
  }

  html += '</div>'; // close analytics-grid
  container.innerHTML = html;

  // Render charts (must happen after DOM insertion)
  setTimeout(() => { renderCharts(speakers, speakerNames); }, 50);
}

function renderCharts(speakers, speakerNames) {
  if (typeof Chart === 'undefined') {
    console.warn('Chart.js not loaded');
    return;
  }

  const colors = speakerNames.map((_, i) => CHART_COLORS[i % CHART_COLORS.length]);
  const talkTimes = speakerNames.map(n => speakers[n].talk_time);
  const turns = speakerNames.map(n => speakers[n].turns);

  // Pie chart
  const pieEl = document.getElementById('pie-chart');
  if (pieEl) {
    _pieChart = new Chart(pieEl, {
      type: 'doughnut',
      data: {
        labels: speakerNames,
        datasets: [{
          data: talkTimes,
          backgroundColor: colors,
          borderWidth: 2,
          borderColor: '#fff',
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: {
            callbacks: {
              label: function(ctx) {
                const secs = ctx.raw;
                const m = Math.floor(secs / 60);
                const s = Math.floor(secs % 60);
                const pct = speakers[ctx.label].percentage;
                return `${ctx.label}: ${m}m ${s}s (${pct}%)`;
              }
            }
          }
        }
      }
    });
  }

  // Bar chart
  const barEl = document.getElementById('bar-chart');
  if (barEl) {
    _barChart = new Chart(barEl, {
      type: 'bar',
      data: {
        labels: speakerNames,
        datasets: [{
          label: 'Turns',
          data: turns,
          backgroundColor: colors.map(c => c + '88'),
          borderColor: colors,
          borderWidth: 1.5,
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(ctx) {
                const avgLen = speakers[ctx.label].avg_turn_length;
                return `${ctx.raw} turns (avg ${Math.round(avgLen)}s each)`;
              }
            }
          }
        },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 11 } }, grid: { color: '#f1f5f9' } },
          x: { ticks: { font: { size: 11 } }, grid: { display: false } }
        }
      }
    });
  }
}

// ===========================================================================
// Sessions list
// ===========================================================================
async function loadSessions(){
  try{
    const r=await f('/api/sessions');
    const list=await r.json();
    const ul=Q('#slist');
    if(!list.length){ul.innerHTML='<li class="empty">No sessions yet</li>';return}

    ul.innerHTML=list.map(s=>{
      const parts=s.id.split('_');
      const dateStr=parts[0]+'  '+(parts[1]||'').replace(/-/g,':');
      const title=s.title||s.id;
      let badges='';
      if(s.files.transcript) badges+='<span class="badge tr">T</span>';
      if(s.files.analysis)   badges+='<span class="badge an">A</span>';
      if(s.files.audio)      badges+='<span class="badge au">W</span>';
      return `<li class="sitem${viewerSession?.id===s.id?' active':''}" data-id="${s.id}" onclick='viewSess(${JSON.stringify(s).replace(/'/g,"&#39;")})'>
        <div class="s-left"><div class="s-title">${esc(title)}</div><div class="s-date">${dateStr}${s.duration?' &middot; '+fmtDur(s.duration):''}${s.language?' &middot; '+s.language.toUpperCase():''}</div></div>
        <div class="s-badges">${badges}</div>
      </li>`;
    }).join('');
  }catch(e){console.error(e)}
}

function viewSess(s){openViewer(s)}

// ===========================================================================
// Helpers
// ===========================================================================
function Q(sel){return document.querySelector(sel)}
function val(id){return document.getElementById(id).value}
function f(url,opts){return fetch(url,opts)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ===========================================================================
// Webhooks (F10)
// ===========================================================================
async function loadWebhooks(){
  try{
    const r=await f('/api/webhooks');
    const hooks=await r.json();
    const ul=Q('#wh-list');
    if(!hooks.length){
      ul.innerHTML='<li class="wh-empty">No webhooks configured</li>';
      return;
    }
    ul.innerHTML=hooks.map(h=>{
      const evts=h.events?h.events.join(', '):'session_complete';
      return `<li class="webhook-item">
        <div class="wh-info">
          <div class="wh-url">${esc(h.url)}</div>
          <div class="wh-meta">${esc(h.format||'json')} &middot; ${esc(evts)}</div>
        </div>
        <div class="wh-actions">
          <button class="wh-btn test" onclick="testWebhook('${esc(h.id)}')">Test</button>
          <button class="wh-btn del" onclick="deleteWebhook('${esc(h.id)}')">Delete</button>
        </div>
      </li>`;
    }).join('');
  }catch(e){
    Q('#wh-list').innerHTML='<li class="wh-empty">Failed to load webhooks</li>';
  }
}

async function addWebhook(){
  const url=Q('#wh-url').value.trim();
  const fmt=Q('#wh-format').value;
  const st=Q('#wh-status');
  if(!url){st.textContent='Please enter a URL';st.className='wh-status fail';return}
  try{
    const r=await f('/api/webhooks',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:url,format:fmt,events:['session_complete']})
    });
    if(!r.ok){const d=await r.json();st.textContent=d.error||'Failed';st.className='wh-status fail';return}
    Q('#wh-url').value='';
    st.textContent='Webhook added';st.className='wh-status ok';
    setTimeout(()=>{st.textContent=''},3000);
    loadWebhooks();
  }catch(e){st.textContent='Error adding webhook';st.className='wh-status fail'}
}

async function deleteWebhook(id){
  if(!confirm('Remove this webhook?'))return;
  try{
    await f(`/api/webhooks/${id}`,{method:'DELETE'});
    loadWebhooks();
  }catch(e){console.error(e)}
}

async function testWebhook(id){
  const st=Q('#wh-status');
  st.textContent='Sending test...';st.className='wh-status';
  try{
    const r=await f(`/api/webhooks/test/${id}`,{method:'POST'});
    const d=await r.json();
    if(d.success){
      st.textContent='Test delivered: '+d.message;st.className='wh-status ok';
    }else{
      st.textContent='Test failed: '+d.message;st.className='wh-status fail';
    }
    setTimeout(()=>{st.textContent=''},5000);
  }catch(e){st.textContent='Test error';st.className='wh-status fail'}
}
