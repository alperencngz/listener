[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "listener"
version = "0.1.0"
description = "Conference listening tool — record, transcribe, and analyze meetings"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    "claude-code-sdk>=0.0.25",
    "jsonschema>=4.0.0",
    "click>=8.0.0",
    "flask>=3.0.0",
    "pyannote.audio>=3.1",
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "noisereduce>=3.0.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.8.0",
]

[project.scripts]
listener = "listener.cli:cli"
